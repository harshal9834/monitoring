# KAVACH-AI Object Detection Dataset Configuration
# Standard Ultralytics YOLOv8/YOLOv11 format for Training Centre Compliance Monitoring

path: /ml/dataset
train: train/images
val: val/images
test: test/images

# Number of classes
nc: 6

# Class names
names:
  0: person
  1: computer
  2: workbench
  3: machine
  4: chair
  5: damaged_equipment

# Dataset Metadata
metadata:
  name: "Govt-SkillCentre-Compliance-v1.4"
  description: "CCTV and mobile inspection footage dataset captured across 48 accredited vocational training centres"
  created_at: "2026-08-15"
  annotator_team: "National Skill Monitoring Directorate (AI Lab)"
  annotation_tool: "CVAT / Label Studio YOLO Export"
  license: "Government Open Data License (Restricted to Authorized Compliance Audits)"
  privacy_compliance: "De-identified: No facial keypoints or biometric identities stored"
  splits:
    train: 2840
    val: 620
    test: 410
    total: 3870
